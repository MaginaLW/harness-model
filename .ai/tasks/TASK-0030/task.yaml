  inputs:
  - TASK-0029 formal V1 runs timed out twice in coverage_xml at the active Policy's
    600-second bound after all preceding required checks passed.
  - The exact isolated Windows coverage command passed 1586 tests with four capability
    skips in 579.8 seconds, leaving insufficient variance below the current bound.
  - The second formal regression run passed in 543.8 seconds, also leaving limited
    variance below its 600-second bound.
  - The first Policy 2.2.0 V1 run completed regression in 622.0 seconds and coverage
    in 735.3 seconds without runner timeout, but exposed two acceptance assertions
    that incorrectly treated historical TASK-0025 Policy 2.1.0 facts as current.
  - GitHub Actions run 33403951577 resolved TASK-0030 correctly but failed before
    executing checks because the exact PR head SHA checkout was detached while the
    task remained bound to branch codex/verification-timeout-hardening.
  - GitHub Actions run 33410732408 proved the exact-SHA branch attachment, contract
    validation, repository identity and task resolution all pass, then failed before
    any Policy check because runner.temp was not Python's default operating-system
    temporary root on ubuntu-latest.
  - GitHub Actions run 33445448671 proved exact-SHA branch attachment and the unified
    runner/Python temporary root both work, then exposed two Linux-only test defects;
    the clean-checkout E2E test depended on uv remaining in the intentionally minimal
    PATH, and the evidence-flow integration test recursively executed the real V1
    toolchain instead of its existing controlled full-category plan.
  permission_requirements: []
  planned_actions:
  - Increment every active Policy document from 2.1.0 to 2.2.0 for the semantic time-budget
    change while leaving historical task and acceptance evidence untouched.
  - Raise V1 and V2 regression_tests from 600 to 900 seconds and coverage_xml from
    600 to 1200 seconds without changing commands, parsers, required flags, or thresholds.
  - Raise the GitHub quality job bound from 35 to 90 minutes so it exceeds the 68.5-minute
    legal V2 per-check budget plus setup and Gate variance.
  - Add exact raw-Policy, parsed-plan, and workflow contract assertions and update
    current operator documentation and Unreleased notes.
  - Update only the Phase 02 self-hosting acceptance test to assert that TASK-0025's
    retained Policy 2.1.0 classification is historical and fails closed under active
    Policy 2.2.0, without modifying any TASK-0025 artifact.
  - Preserve checkout of the exact pull-request head SHA, then attach that same commit
    to github.head_ref before formal verification with fail-closed pre/post branch
    and SHA assertions; do not weaken the runtime branch binding.
  - Bind TMPDIR to runner.temp only for the formal Verify and Gate step and derive
    the run directory beneath it, without changing verifier code or weakening strict
    descendant and evidence-output containment checks.
  - Make the clean-checkout E2E installer use the active interpreter's base Python
    pip when a uv-created environment has no pip, without widening the verification
    runner environment or depending on uv in PATH.
  - Make the V0/V1 evidence reproduction integration test use its existing controlled
    full-category plan so it tests evidence identities, replay and Gate without a
    recursive environment-sensitive real Policy execution.
  protections:
    dry_run: true
    verified_backup: true
  reversibility: reversible
  schema_version: '1.0'
  scope:
    clear: true
  task_id: TASK-0030
  verification:
    automatic: true
    tools_missing: false
  verification_methods:
  - Run focused Policy, verification-plan, workflow, Phase 02 self-hosting acceptance,
    contract, and traceability tests.
  - Run the Policy-defined V1 verification plan and read-only Gate on the final subject.
  - Require the real pull request to execute formal task resolution, CI verification,
    Gate, and diagnostics upload for its final head.
  - Assert the workflow keeps exact-SHA checkout and attaches that immutable commit
    to the pull-request source branch before formal verification; retain failed run
    33403951577 as historical platform evidence.
  - Assert formal Verify and Gate use one runner temporary root for Python tempfile,
    run directory, evidence, Gate output and diagnostics, while a distinct existing
    sibling root remains rejected; retain failed run 33410732408 as historical platform
    evidence.
  - Run both Linux-failing tests with focused assertions for the no-pip/base-interpreter
    installer fallback and the controlled V1 evidence reproduction path; retain failed
    run 33445448671 and its diagnostics artifact as historical platform evidence.
  verification_requirements:
    acceptance_required: false
    independent_verifier_required: false
    integration_required: false
    targeted_mutation_required: false
