  planned_actions:
  - Refactor the existing current-facts binding check into one public read-only observation
    evaluation seam without changing the deterministic decision table
  - Add a bounded observation adapter with explicit apply, dry-run and CI modes, strict
    mode/source/actor validation and canonical JSON output
  - Keep apply task-local and idempotent through the existing service while making
    dry-run and CI strictly non-persistent
  - Prove semantic parity for every observation kind, route and verification level,
    plus end-to-end parity for the two actually supported Hook facts
  - Cover malformed input, ambiguity, stale bindings, path escape, unknown fields,
    ledger-write prevention and stable exit behavior
  - Record the supported shell, Hook-install and operating-system boundaries without
    claiming a generic sandbox
  - Project only Chapter 12.5 after implementation, formal verification and required
    review facts are current
