  - Unit tests for read-only evaluation, mode/source/actor validation, canonical output
    and zero-write dry-run/CI behavior
  - Matrix tests for all five observation kinds across AUTO, ASK, REVIEW, BLOCK and
    V0, V1, V2 with source-sensitive digests but identical decision semantics
  - Isolated temporary-repository integration tests for pre-commit scope and pre-command
    high-risk Hook versus CLI apply/dry-run and CI read-only decisions
  - Negative tests for malformed or duplicate-key JSON, unknown fields, task mismatch,
    task ambiguity, path escape, stale Git/Policy/classification bindings and persistence-service
