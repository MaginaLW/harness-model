  - 逐 blob 校验：.ai 下只有 6 个 blob 含 CR，全部是 logs/**/.coverage（SQLite 二进制）；其余 987 个 blob
    已是纯 LF，故 renormalize 对它们是恒等操作
  - AGENTS.md 升级清单包含 .gitignore 与 .gitattributes；任务账本记录与证据为追加式，不得重写
