  goal: 让 pre-command wrapper 在 task 持有有效 action 批准时放行 push/merge，使 Policy 中的 push/merge
    批准要求从不可执行的流程约定变为可执行的拦截；wrapper 仍不消费批准、不执行命令、不自行安装，并按项目所有者的明确决定修改 docs/operations/hooks.md
    中「不得把诊断结果转为许可」这一原则
  inputs:
  - tools/hooks/pre_command.py:78 check_pre_command 传入 action_allowed=permission.allowed_automatically（Policy
    常量），从不查询 action 批准
  - 实测：read -> allowed_automatically=True -> 退出 0；push/merge/delete/deploy -> False
    -> 退出 2，与是否持有批准无关
  - src/aiflow/approval.py:295 matching_approval 已实现「返回第一个新鲜的指定类型批准」，approval_is_current
    与 canonical_action_sha256 亦已存在
  - src/aiflow/freshness.py 的 action_approval 分支当前无生产调用方（status_service.py:132 把 used_action_sha256s
    硬编码为 ()）
  - .git/hooks/ 当前未安装任何 hook
  - docs/operations/hooks.md 现载原则：wrappers 不得 consume an approval、不得 turn a diagnostic
    result into permission —— 项目所有者已明确决定修改后者
  planned_actions:
  - 在 check_pre_command 中，当 Policy 不允许自动执行时，改为查询该 task 是否持有与本次动作 action_sha256 匹配且新鲜的
    action 批准，据此决定 action_allowed
  - 保持 wrapper 不消费批准、不执行命令、不自行安装；仍记录 observation
  - 更新 docs/operations/hooks.md：明确 wrapper 在持有有效批准时可放行，同时保留其余 fail-closed 约束
  - 补正向与负向测试：无批准仍拒；批准存在但 action_sha256 不匹配仍拒；批准过期仍拒；批准已被消费仍拒；批准新鲜且匹配才放行
