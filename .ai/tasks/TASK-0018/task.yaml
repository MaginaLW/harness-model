  permission_requirements: []
  planned_actions:
  - Define one closed version 1.0 observation-decision contract for record, escalate
    and refuse dispositions with stable reason codes, optional REVIEW/BLOCK targets
    and closed recovery conditions
  - Implement a pure deterministic mapper from the five immutable observation kinds
    plus current route and verification facts, with no repository reads, mutation
    or route/verification downgrade
  - Add a bounded service that validates task, base, subject and active Policy bindings
    before consuming a decision
  - Persist record and refusal as task-local non-state audit events, and delegate
    every state-changing escalation exclusively to the existing monotonic escalate_task
    path
  - Register only observation_recorded and observation_refused as closed non-state
    event names without adding or changing any task-state transition
  - Fail closed on unknown decisions, stale bindings, unsupported state, lower targets,
    missing recovery facts and unsafe payloads without echoing sensitive values
  - Add contract, unit and integration replay tests across all five kinds, four sources
    and AUTO/ASK/REVIEW/BLOCK monotonicity
  - Project only Chapter 12.2 progress after implementation, verification and required
    review facts are current; leave Hooks, CLI/CI parity and Chapter exits pending
  protections:
    dry_run: true
    verified_backup: true
  reversibility: reversible
  schema_version: '1.0'
  scope:
    clear: true
  task_id: TASK-0018
  verification:
    automatic: true
    tools_missing: false
  verification_methods:
  - Schema and fixture validation for every disposition and closed recovery payload
  - Unit tests for deterministic mapping, immutability, stable reason codes and no-downgrade
    behavior
  - Integration tests for task-local record/refusal events, escalation delegation,
    idempotency and stale-binding refusal
  - State-core regression tests proving the two new audit events are non-state only
    and cannot authorize a transition
  - Regression proof that existing observation parsing, escalation, task state, V0/V1/V2
    evidence, Gate, CLI and Policy conclusions remain unchanged
  - Ruff, format check, mypy, full pytest, branch coverage, diff coverage at least
    90%, Git scope and git diff check
