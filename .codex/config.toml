# Project-scoped Codex defaults. The app's Advanced picker can still override
# the model and reasoning effort for an individual turn.
model = "gpt-5.6-sol"
model_reasoning_effort = "max"

[agents]
enabled = true
# Sol currently uses Multi-Agent v2 while Luna is catalogued as v1. Native
# Sol -> Luna spawning is therefore rejected by the active-backend filter.
# Terra is the compatible native-worker fallback until the catalog is fixed.
default_subagent_model = "gpt-5.6-terra"
default_subagent_reasoning_effort = "medium"
max_concurrent_threads_per_session = 2
