name: ai-quality-gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ai-quality-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ai-quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project
        run: python -m pip install ".[dev]"
      - name: Detect repository governance mode
        id: governance
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          marker="$RUNNER_TEMP/base-bootstrap-mode.yaml"
          if git show "${BASE_SHA}:.ai/bootstrap-mode.yaml" > "$marker" 2>/dev/null \
            && grep -qx 'mode: bootstrap_auto' "$marker" \
            && grep -qx 'status: active' "$marker"; then
            echo "bootstrap_active=true" >> "$GITHUB_OUTPUT"
          else
            echo "bootstrap_active=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate contracts
        run: python -m pytest tests/unit/test_contracts.py tests/integration/test_templates_and_policy.py -q
      - name: Bootstrap quality checks
        if: steps.governance.outputs.bootstrap_active == 'true'
        run: |
          python -m pytest -q
          python -m ruff check .
          python -m ruff format --check .
          python -m mypy
      - name: Read repository identity
        if: steps.governance.outputs.bootstrap_active != 'true'
        run: test -s .ai/repository-id && sha256sum .ai/repository-id
      - name: Resolve task
        if: steps.governance.outputs.bootstrap_active != 'true'
        id: task
        env:
          AI_FLOW_TASK_ID: ${{ vars.AI_FLOW_TASK_ID }}
        run: >-
          python tools/ci/resolve_task.py
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"
          --task "$AI_FLOW_TASK_ID"
          --output "$GITHUB_OUTPUT"
      - name: Verify and Gate
        if: steps.governance.outputs.bootstrap_active != 'true'
        env:
          TASK_ID: ${{ steps.task.outputs.task_id }}
        run: |
          run_dir="$RUNNER_TEMP/aiflow"
          mkdir -p "$run_dir"
          python -m aiflow verify "$TASK_ID" --ci --ci-run-dir "$run_dir" --output "$run_dir/evidence.json"
          python -m aiflow gate "$TASK_ID" --evidence "$run_dir/evidence.json" --format json > "$run_dir/gate.json"
      - name: Upload AI Flow diagnostics
        if: always() && steps.governance.outputs.bootstrap_active != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ai-flow-${{ steps.task.outputs.task_id }}
          path: ${{ runner.temp }}/aiflow
          retention-days: 14
          if-no-files-found: warn
