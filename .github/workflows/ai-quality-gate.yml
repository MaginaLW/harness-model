name: ai-quality-gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ai-quality-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ai-quality-gate:
    runs-on: ubuntu-latest
    # The fixed V2 checks may consume 68.5 minutes serially; leave room for
    # dependency setup, Gate evaluation, diagnostics, and runner variance.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.5"
      - name: Install locked project environment
        run: |
          uv lock --check
          uv sync --locked --all-extras
      - name: Detect repository governance mode
        id: governance
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          marker="$RUNNER_TEMP/base-bootstrap-mode.yaml"
          if git show "${BASE_SHA}:.ai/bootstrap-mode.yaml" > "$marker" 2>/dev/null \
            && grep -qx 'mode: bootstrap_auto' "$marker" \
            && grep -qx 'status: active' "$marker"; then
            echo "bootstrap_active=true" >> "$GITHUB_OUTPUT"
          else
            echo "bootstrap_active=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Attach exact PR head branch
        if: steps.governance.outputs.bootstrap_active != 'true'
        env:
          PR_HEAD_REF: ${{ github.head_ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          test -n "$PR_HEAD_REF"
          git check-ref-format --branch "$PR_HEAD_REF"
          test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
          git switch --force-create "$PR_HEAD_REF" "$PR_HEAD_SHA"
          test "$(git symbolic-ref --quiet --short HEAD)" = "$PR_HEAD_REF"
          test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
      - name: Validate contracts
        run: >-
          uv run --locked python -m pytest
          tests/unit/test_contracts.py tests/integration/test_templates_and_policy.py -q
      - name: Bootstrap quality checks
        if: steps.governance.outputs.bootstrap_active == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          COVERAGE_FILE="$RUNNER_TEMP/.coverage" \
            uv run --locked python -m pytest -q \
            --cov=aiflow --cov-branch --cov-fail-under=85 \
            --cov-report=term-missing \
            --cov-report="xml:$RUNNER_TEMP/coverage.xml"
          uv run --locked diff-cover "$RUNNER_TEMP/coverage.xml" --compare-branch "$BASE_SHA" --fail-under=90
          git diff --check "$BASE_SHA..$HEAD_SHA"
          uv run --locked ruff check .
          uv run --locked ruff format --check .
          uv run --locked mypy
      - name: Read repository identity
        if: steps.governance.outputs.bootstrap_active != 'true'
        run: test -s .ai/repository-id && sha256sum .ai/repository-id
      - name: Resolve task
        if: steps.governance.outputs.bootstrap_active != 'true'
        id: task
        env:
          AI_FLOW_TASK_ID: ${{ vars.AI_FLOW_TASK_ID }}
        run: >-
          uv run --locked python tools/ci/resolve_task.py
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"
          --task "$AI_FLOW_TASK_ID"
          --output "$GITHUB_OUTPUT"
      - name: Verify and Gate
        if: steps.governance.outputs.bootstrap_active != 'true'
        env:
          TASK_ID: ${{ steps.task.outputs.task_id }}
          TMPDIR: ${{ runner.temp }}
        run: |
          run_dir="$TMPDIR/aiflow"
          mkdir -p "$run_dir"
          uv run --locked python -m aiflow verify "$TASK_ID" --ci --ci-run-dir "$run_dir" --output "$run_dir/evidence.json"
          uv run --locked python -m aiflow gate "$TASK_ID" --evidence "$run_dir/evidence.json" --format json > "$run_dir/gate.json"
      - name: Upload AI Flow diagnostics
        if: always() && steps.governance.outputs.bootstrap_active != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ai-flow-${{ steps.task.outputs.task_id }}
          path: ${{ runner.temp }}/aiflow
          retention-days: 14
          if-no-files-found: warn
